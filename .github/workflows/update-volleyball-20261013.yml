name: Update volleyball data 2026-10-13

on:
  push:
    branches: [main]
    paths:
      - 'scripts/update_volleyball_20261013.py'
      - '.github/workflows/update-volleyball-20261013.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply official volleyball update
        run: python scripts/update_volleyball_20261013.py

      - name: Commit dashboard update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard-sync.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update official Education Cup volleyball information"
            git push
          fi
