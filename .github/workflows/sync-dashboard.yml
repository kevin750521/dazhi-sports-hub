name: Sync sports dashboard data

on:
  push:
    branches: [main]
    paths:
      - 'dashboard-sync.json'
      - 'scripts/sync_supabase.py'
      - 'scripts/fix_high_girls_basketball.py'
      - 'scripts/patch_calendar.py'
      - '.github/workflows/sync-dashboard.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync Drive-audited data to Supabase
        env:
          SUPABASE_URL: https://hdxrublbpaptthmflnrn.supabase.co
          SUPABASE_KEY: sb_publishable_n3ONLlgwYQ0TAOcxkKoNhg_ZwL6M9wP
          SYNC_DATA_FILE: dashboard-sync.json
        run: python scripts/sync_supabase.py

      - name: Apply updated high girls basketball schedule
        env:
          SUPABASE_URL: https://hdxrublbpaptthmflnrn.supabase.co
          SUPABASE_KEY: sb_publishable_n3ONLlgwYQ0TAOcxkKoNhg_ZwL6M9wP
        run: python scripts/fix_high_girls_basketball.py

      - name: Patch calendar to use live schedule data
        run: python scripts/patch_calendar.py

      - name: Commit calendar patch if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No index.html changes needed"
          else
            git commit -m "Render calendar from live schedules data"
            git push
          fi

