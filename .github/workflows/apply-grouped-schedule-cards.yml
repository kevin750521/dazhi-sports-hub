name: Apply grouped schedule cards

on:
  push:
    branches: [main]
    paths:
      - 'scripts/group_schedule_cards.py'
      - '.github/workflows/apply-grouped-schedule-cards.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Group schedule cards by competition
        run: python scripts/group_schedule_cards.py

      - name: Commit grouped card layout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Group schedule grid cards by competition"
            git push
          fi
