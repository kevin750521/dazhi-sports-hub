<html lang="zh-TW">
<head>
  <meta charset="UTF-8">

  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei",sans-serif;background:#fff;color:#0f172a}
    .wrap{max-width:1600px;margin:0 auto;padding:10px}
    .head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:14px}
    h1{font-size:1.35rem;margin:0 0 4px;font-weight:900}
    .title-link{color:inherit;text-decoration:none}
    .title-link:hover{text-decoration:underline;text-underline-offset:4px}
    .sub{font-size:.82rem;color:#64748b}
    .toolbar{display:flex;gap:8px;flex-wrap:wrap}
    .toolbar input,.toolbar select{border:1px solid #cbd5e1;border-radius:7px;padding:8px 10px;font-size:.82rem;background:#fff}
    .toolbar input:focus{outline:2px solid #2563eb;outline-offset:1px}
    .filter-header{cursor:default;min-width:93px;white-space:normal}
    .filter-header label{display:block;margin-bottom:5px;font-size:.78rem;font-weight:900}
    .filter-header select{width:100%;max-width:132px;border:1px solid #cbd5e1;border-radius:7px;padding:5px 4px;background:#fff;color:#0f172a;cursor:pointer;font-size:.73rem;font-weight:600}
    .filter-header select:focus{outline:2px solid #2563eb;outline-offset:1px}
    .filter-state{font-size:.75rem;color:#475569;margin:0 0 7px}

    .tablebox{border:1px solid #dbe3ee;border-radius:12px;overflow-x:auto;overflow-y:visible;box-shadow:0 2px 8px rgba(15,23,42,.05);-webkit-overflow-scrolling:touch}
    table{width:100%;border-collapse:collapse;min-width:1010px;table-layout:fixed}
    th,td{padding:7px 6px;border-bottom:1px solid #e2e8f0;text-align:left;vertical-align:middle;font-size:.75rem;line-height:1.35;overflow-wrap:anywhere}
    th{background:#f8fafc;font-weight:900;white-space:nowrap;cursor:pointer;position:sticky;top:0;z-index:2}
    tr:hover td{background:#fbfdff}
    .sport{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-weight:800;white-space:nowrap;border:1px solid #dbeafe;background:#eff6ff;color:#1d4ed8}
    tr.completed td{background:#f8fafc;color:#64748b}
    tr.completed .status{background:#e2e8f0;border-color:#cbd5e1;color:#475569}
    .status{display:inline-block;padding:3px 6px;border-radius:7px;background:#ecfdf5;border:1px solid #a7f3d0;color:#047857;font-size:.7rem;font-weight:800;white-space:normal}
    .roster-cell{min-width:100px;max-width:170px}
    .roster-details summary{cursor:pointer;color:#1d4ed8;font-weight:800}
    .roster-scroll{max-height:270px;overflow:auto;padding:8px;border-radius:7px;background:#f8fafc;margin-top:6px}
    .roster-group{padding:4px 0;border-bottom:1px solid #e2e8f0;font-size:.75rem}
    .roster-group strong{color:#1e293b}
    .roster-note{font-size:.7rem;color:#64748b;margin-top:8px}
    .match{font-weight:800}
    .muted{color:#64748b}
    .empty{padding:40px;text-align:center;color:#94a3b8;font-weight:700}
    .foot{font-size:.72rem;color:#94a3b8;margin-top:8px;text-align:right}
    .scroll-hint{display:block;font-size:.72rem;color:#64748b;margin:0 0 4px;text-align:right}
    .slidebar{display:flex;align-items:center;gap:10px;padding:5px 9px;margin:0 0 6px;background:#f8fafc;border:1px solid #dbe3ee;border-radius:8px}
    .slidebar label{flex:none;color:#475569;font-size:.73rem;font-weight:700}
    .slidebar input[type=range]{flex:1;min-width:0;accent-color:#2563eb;cursor:grab;height:18px;touch-action:pan-y}
    .slidebar input[type=range]:active{cursor:grabbing}
    .slidebar[hidden]{display:none}
    .cell-brief{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-clamp:2}
    #tbl th:nth-child(1){width:100px} #tbl th:nth-child(2){width:135px}
    #tbl th:nth-child(3){width:134px} #tbl th:nth-child(4){width:100px}
    #tbl th:nth-child(5){width:110px} #tbl th:nth-child(6){width:130px}
    #tbl th:nth-child(7){width:118px} #tbl th:nth-child(8){width:134px}
    #tbl th:nth-child(9){width:110px}

    @media(max-width:1100px){

      .head{gap:10px}

      .sub{font-size:.76rem}
      .toolbar{width:100%}
      .toolbar input{flex:1;min-width:180px}
      .scroll-hint{display:block}
      table{min-width:1010px}
      th,td{padding:7px 6px;font-size:.74rem}
    }
    @media(max-width:700px){
      .wrap{padding:8px}
      .toolbar input{width:100%;min-width:0;flex:1 1 100%}
      .tablebox{border-radius:8px}
      table{min-width:1010px}
      th,td{padding:6px 5px;font-size:.72rem}
    }
  </style>
</head>
<body>
<div class="wrap">
  <div class="head">

<script>

const tbody=document.querySelector('tbody');

function updateHorizontalSlider(){
 const max=Math.max(0,tableScroller.scrollWidth-tableScroller.clientWidth);
 horizontalSlider.max=String(Math.max(1,Math.ceil(max)));
 horizontalSlider.value=String(Math.min(max,tableScroller.scrollLeft));
 slidebar.hidden=max<5;
}
horizontalSlider.addEventListener('input',()=>{tableScroller.scrollLeft=Number(horizontalSlider.value)});
tableScroller.addEventListener('scroll',()=>{
 const max=Math.max(0,tableScroller.scrollWidth-tableScroller.clientWidth);
 horizontalSlider.value=String(Math.min(max,tableScroller.scrollLeft));
},{passive:true});
window.addEventListener('resize',updateHorizontalSlider);


function norm(v){return String(v??'').trim()}
function dateKey(v){const s=norm(v).split(' ')[0];const m=s.match(/^(\d{2,4})\/(\d{1,2})\/(\d{1,2})$/);if(m){let y=+m[1];if(y<1911)y+=1911;return y*10000+(+m[2])*100+(+m[3]);}return 99999999}
function formatMatchDate(v){
  const raw=norm(v);
  const m=raw.match(/^(\d{2,4})\/(\d{1,2})\/(\d{1,2})(.*)$/);
  if(!m)return raw;
  let y=+m[1];
  const month=+m[2],day=+m[3];
  const displayYear=y;
  if(y<1911)y+=1911;
  const d=new Date(y,month-1,day);
  if(d.getFullYear()!==y||d.getMonth()!==month-1||d.getDate()!==day)return raw;
  const weekday=['日','一','二','三','四','五','六'][d.getDay()];
  return `${displayYear}/${m[2]}/${m[3]}（${weekday}）${m[4]||''}`;
}
function esc(s){return norm(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}
function briefTournament(v){
 return norm(v).replace(/^臺北市(?:立)?115學年度/, '').replace(/^115學年度/, '')
  .replace(/中等學校/g,'').replace(/錦標賽/g,'賽').replace(/全國高中/g,'高中');
}
function briefStatus(v){
 const text=norm(v);
 if(text.includes('已完賽'))return text.replace('｜成績：','｜').replace('｜晉級：','｜晉級');
 if(text.includes('大會場序已公告'))return '場序已公告／待確認';
 if(text.includes('賽程待公告'))return '賽程待公告';
 if(text.includes('賽程已公告'))return '賽程已公告';
 return text;
}
function sportName(s){return norm(s).replace(/^[^\u4e00-\u9fff]+/,'').trim()}
function sportLabel(s){const x=sportName(s);const emo=x.includes('籃球')?'🏀':x.includes('排球')?'🏐':x.includes('羽球')?'🏸':x.includes('桌球')?'🏓':x.includes('擊劍')?'🤺':x.includes('空手道')?'🥋':x.includes('網球')?'🎾':x.includes('棒球')?'⚾':x.includes('足球')?'⚽':'🏅';return `${emo} ${x||'其他'}`}

const tennisDayGroups={
 '115/11/09':[['國男甲團體','hard','jBTeam'],['國女甲團體','hard','jGTeam'],['高男甲團體','hard','hBTeam'],['高女甲團體','hard','hGTeam']],
 '115/11/10':[['國男甲團體','hard','jBTeam'],['國女甲團體','hard','jGTeam'],['國男甲單打','hard','jBSingle'],['高男甲單打','hard','hBSingle'],['高女甲單打','hard','hGSingle']],
 '115/11/11':[['國男甲單打','hard','jBSingle'],['國女甲單打','hard','jGSingle'],['高男甲單打','hard','hBSingle'],['國男甲雙打','hard','jBDouble'],['國女甲雙打','hard','jGDouble'],['高男甲雙打','hard','hBDouble']],

 '115/11/16':[['國男團體','soft','jBTeam'],['國女團體','soft','jGTeam'],['高男團體','soft','hBTeam'],['高女團體','soft','hGTeam'],['國男單打','soft','jBSingle'],['高男單打','soft','hBSingle'],['高女單打','soft','hGSingle']],
 '115/11/17':[['國男雙打','soft','jBDouble'],['國女雙打','soft','jGDouble'],['高男雙打','soft','hBDouble'],['高中混雙','soft','hMixed']]
};
function rosterGroups(r){
 const name=norm(r.tournament_name),date=norm(r.match_date).split(' ')[0];
 if(name.includes('教育盃')&&name.includes('網球')&&tennisDayGroups[date]){
   return tennisDayGroups[date].map(([label,kind,key])=>({label,text:publicRoster[kind][key]}));
 }
 if(name.includes('教育盃')&&name.includes('羽球')){
   return [
     {label:'高中男子乙組團體（10人）',text:'李○鴻、鄭○剛、黃○哲、江○翰、吳○光、蔡○道、胡○瑄、周○丞、姚○文、方○希'},
     {label:'高中教師男子團體（7人）',text:'鍾○益、林○祥、劉○陞、陳○宇、鄭○文、鄭○鴻、陳○仁'}
   ];
 }
 if(name.includes('教育盃')&&name.includes('桌球')){
   return [['國男乙組',publicRoster.ping.jB],['國女乙組',publicRoster.ping.jG],['高男乙組',publicRoster.ping.hB],['高女乙組',publicRoster.ping.hG]].map(([label,text])=>({label,text}));
 }
 if(name.includes('教育盃')&&name.includes('擊劍')){
   const match=norm(r.opponents_draw).match(/[\u4e00-\u9fff]○[\u4e00-\u9fff]/);
   if(match)return [{label:'參賽選手',text:match[0]}];
 }
 return [];
}
function rosterText(r){return rosterGroups(r).map(x=>x.label+' '+x.text).join(' ')}
function rosterCell(r){
 const groups=rosterGroups(r);
 if(!groups.length)return '<span class="muted">名單待確認</span>';
 const units=groups.map(x=>'<div class="roster-group"><strong>'+esc(x.label)+'</strong><div>'+esc(x.text)+'</div></div>').join('');
 return '<details class="roster-details"><summary>檢視報名選手（'+groups.length+'組）</summary><div class="roster-scroll">'+units+'<div class="roster-note">依報名表彙整，非當日確定上場名單。</div></div></details>';
}

function isCompleted(r){return /已完賽|已結束|比賽結束/.test(norm(r.status))}
function isRangeRow(r){return /[～~至]|\d\s*[-–—]\s*\d/.test(norm(r.match_date))}
function isPending(r){return /待公告|待確認|待抽籤|區間摘要/.test(norm(r.status))||isRangeRow(r)}
function stageOf(r){
 if(isCompleted(r))return 'finished';
 if(isPending(r))return 'pending';
 const d=dateKey(r.match_date), now=new Date(),today=now.getFullYear()*10000+(now.getMonth()+1)*100+now.getDate();
 return d>=today ? 'upcoming' : 'past';
}
function rowPriority(r){
  if(isCompleted(r))return 3;
  const date=dateKey(r.match_date);
  if(date===99999999)return 2;
  const now=new Date();
  const today=now.getFullYear()*10000+(now.getMonth()+1)*100+now.getDate();
  return date>=today?0:1;
}
function sortDateTime(r){const d=norm(r.match_date);const t=norm(r.match_time);return d.includes(':')?d.slice(d.search(/\d\d:\d\d/)):t}
function filtered(){
  const q=norm(document.getElementById('q').value).toLowerCase();
  const sp=document.getElementById('sport').value,stage=document.getElementById('stage').value;
  return rows.filter(r=>{
    if(sp&&sportName(r.sport)!==sp)return false;
    if(stage&&stageOf(r)!==stage)return false;
    if(q&&!keys.some(k=>norm(k==='athletes'?rosterText(r):r[k]).toLowerCase().includes(q)))return false;
    return true;
  }).sort((a,b)=>{
    const groupA=rowPriority(a),groupB=rowPriority(b);
    if(groupA!==groupB)return groupA-groupB;
    let av=sortKey==='athletes'?rosterText(a):a[sortKey],bv=sortKey==='athletes'?rosterText(b):b[sortKey];
    if(sortKey==='match_date'){
      const da=dateKey(av),db=dateKey(bv);
      // 未來比賽依日期近到遠；歷史未標記場次依最近到最遠；已完賽永遠放最後。
      const dir=groupA===0?1:groupA===1?-1:sortDir;
      if(da!==db)return (da-db)*dir;
      return sortDateTime(a).localeCompare(sortDateTime(b),'zh-Hant',{numeric:true})*dir;
    }
    return norm(av).localeCompare(norm(bv),'zh-Hant',{numeric:true})*sortDir
  })
}
function render(){
  const data=filtered();
  document.getElementById('filterState').textContent='顯示 '+data.length+' 筆／共 '+rows.length+' 筆賽程（已完賽排在最後）';
  tbody.innerHTML=data.length?data.map(r=>`<tr class="${isCompleted(r)?'completed':''}">
    <td><span class="sport">${esc(sportLabel(r.sport))}</span></td>
    <td title="${esc(r.tournament_name)}"><strong class="cell-brief">${esc(briefTournament(r.tournament_name))}</strong></td>
    <td title="${esc(r.division)}"><span class="cell-brief">${esc(r.division)}</span></td>
    <td><strong>${esc(formatMatchDate(r.match_date))}</strong></td>
    <td title="${esc(r.venue)}"><span class="cell-brief">${esc(r.venue)}</span></td>
    <td class="match" title="${esc(r.opponents_draw)}"><span class="cell-brief">${esc(r.opponents_draw)}</span></td>
    <td title="${esc(r.advancement_rule||'-')}"><span class="cell-brief">${esc(r.advancement_rule||'-')}</span></td>
    <td title="${esc(r.status||'-')}"><span class="status cell-brief">${esc(briefStatus(r.status||'-'))}</span></td>
    <td class="roster-cell">${rosterCell(r)}</td>
  </tr>`).join(''):`<tr><td colspan="9" class="empty">目前沒有符合條件的資料</td></tr>`;
  requestAnimationFrame(updateHorizontalSlider)
}

 advancement_rule:'比賽日期為大會區間，正式逐場賽程待公告',
 status:'已報名｜賽程待公告（2隊17人）'
};
function ensureBadminton(list){
 if(!list.some(r=>norm(r.tournament_name).includes('教育盃') && norm(r.tournament_name).includes('羽球'))){
   return [...list,confirmedBadminton];
 }
 return list;
}
function setRows(data){
 rows=ensureBadminton(Array.isArray(data)?data:[]);
 const sports=[...new Set(rows.map(r=>sportName(r.sport)).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'zh-Hant'));
 const current=document.getElementById('sport').value;
 document.getElementById('sport').innerHTML='<option value="">全部</option>'+sports.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');
 if(sports.includes(current))document.getElementById('sport').value=current;
 render();
}
async function getDirectSchedules(){
 if(sb){
   let result=[],chunk=1000;
   for(let from=0;from<100000;from+=chunk){
     const {data,error}=await sb.from('schedules').select('*').order('id',{ascending:true}).range(from,from+chunk-1);
     if(error)throw error;
     result.push(...(data||[]));
     if(!data||data.length<chunk)break;
   }
   return result;
 }
 const response=await fetch(SUPABASE_URL+'/rest/v1/schedules?select=*&order=id.asc',{
   headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY},
   cache:'no-store'
 });
 if(!response.ok)throw new Error('Supabase HTTP '+response.status);
 return response.json();
}
async function load(){
  try{
    // 與主儀錶板共用同網域讀取；避免跨網域 SDK 與瀏覽器快取造成資料遺漏。
    const response=await fetch('/api/dashboard-data?ts='+Date.now(),{cache:'no-store'});
    if(!response.ok)throw new Error('站內資料服務 HTTP '+response.status);
    const result=await response.json();
    if(!Array.isArray(result.schedules))throw new Error('賽程回傳格式錯誤');
    setRows(result.schedules);
  }catch(err){
    console.warn('公告頁站內同步失敗，嘗試 Supabase 直接讀取',err);
    try{setRows(await getDirectSchedules())}
    catch(fallbackError){
      console.error('公告頁同步失敗，顯示已確認之羽球報名摘要',fallbackError);
      setRows([]);
      document.getElementById('filterState').textContent='雲端賽程載入失敗，僅顯示已確認報名資料（非完整賽程）';
    }
  }
}

document.getElementById('q').addEventListener('input',render);
document.getElementById('sport').addEventListener('change',render);
document.getElementById('stage').addEventListener('change',render);
document.querySelectorAll('th[data-k]').forEach(th=>th.addEventListener('click',()=>{
  const k=th.dataset.k;
  if(sortKey===k)sortDir*=-1;else{sortKey=k;sortDir=1}
  document.querySelectorAll('th[data-k]').forEach(x=>x.textContent=x.textContent.replace(/\s[▲▼]$/,''));
  th.textContent+=sortDir===1?' ▲':' ▼';
  render()
}));
load();
