<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>大直高中運動賽事公告</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei",sans-serif;background:#fff;color:#0f172a}
    .wrap{max-width:1600px;margin:0 auto;padding:16px}
    .head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:14px}
    h1{font-size:1.35rem;margin:0 0 4px;font-weight:900}
    .title-link{color:inherit;text-decoration:none}
    .title-link:hover{text-decoration:underline;text-underline-offset:4px}
    .sub{font-size:.82rem;color:#64748b}
    .toolbar{display:flex;gap:8px;flex-wrap:wrap}
    .toolbar input,.toolbar select{border:1px solid #cbd5e1;border-radius:7px;padding:8px 10px;font-size:.82rem;background:#fff}
    .tablebox{border:1px solid #dbe3ee;border-radius:12px;overflow-x:auto;overflow-y:visible;box-shadow:0 2px 8px rgba(15,23,42,.05);-webkit-overflow-scrolling:touch}
    table{width:100%;border-collapse:collapse;min-width:1180px}
    th,td{padding:11px 12px;border-bottom:1px solid #e2e8f0;text-align:left;vertical-align:middle;font-size:.82rem;line-height:1.45}
    th{background:#f8fafc;font-weight:900;white-space:nowrap;cursor:pointer;position:sticky;top:0;z-index:2}
    .filterrow th{top:41px;padding:8px;background:#f8fafc}
    .filterrow input{width:100%;min-width:74px;border:1px solid #cbd5e1;border-radius:6px;padding:6px 8px;font-size:.76rem}
    tr:hover td{background:#fbfdff}
    .sport{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-weight:800;white-space:nowrap;border:1px solid #dbeafe;background:#eff6ff;color:#1d4ed8}
    tr.completed td{background:#f8fafc;color:#64748b}
    tr.completed .status{background:#e2e8f0;border-color:#cbd5e1;color:#475569}
    .status{display:inline-block;padding:3px 8px;border-radius:999px;background:#ecfdf5;border:1px solid #a7f3d0;color:#047857;font-size:.74rem;font-weight:800;white-space:nowrap}
    .roster-cell{min-width:190px;max-width:310px}
    .roster-details summary{cursor:pointer;color:#1d4ed8;font-weight:800}
    .roster-scroll{max-height:270px;overflow:auto;padding:8px;border-radius:7px;background:#f8fafc;margin-top:6px}
    .roster-group{padding:4px 0;border-bottom:1px solid #e2e8f0;font-size:.75rem}
    .roster-group strong{color:#1e293b}
    .roster-note{font-size:.7rem;color:#64748b;margin-top:8px}
    .match{font-weight:800}
    .muted{color:#64748b}
    .empty{padding:40px;text-align:center;color:#94a3b8;font-weight:700}
    .foot{font-size:.72rem;color:#94a3b8;margin-top:8px;text-align:right}
    .scroll-hint{display:none;font-size:.72rem;color:#64748b;margin:0 0 6px;text-align:right}
    @media(max-width:1100px){
      .wrap{padding:10px}
      .head{gap:10px}
      h1{font-size:1.15rem}
      .sub{font-size:.76rem}
      .toolbar{width:100%}
      .toolbar input,.toolbar select{flex:1;min-width:180px}
      .scroll-hint{display:block}
      table{min-width:1120px}
      th,td{padding:9px 8px;font-size:.76rem}
      .filterrow th{padding:6px}
      .filterrow input{padding:5px 6px;font-size:.72rem}
    }
    @media(max-width:700px){
      .wrap{padding:8px}
      .toolbar input,.toolbar select{width:100%;min-width:0;flex:1 1 100%}
      .tablebox{border-radius:8px}
      table{min-width:1080px}
      th,td{padding:8px 7px;font-size:.73rem}
    }
  </style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div>
      <h1><a class="title-link" href="https://dazhi-sports-hub.vercel.app/announcement-schedule" target="_blank" rel="noopener noreferrer">臺北市立大直高級中學｜運動賽事公告</a></h1>
      <div class="sub">賽程資料自動同步；可依欄位篩選，點欄名可排序。</div>
    </div>
    <div class="toolbar">
      <input id="q" placeholder="搜尋賽事、組別、場地…">
      <select id="sport"><option value="">全部運動種類</option></select>
    </div>
  </div>
  <div class="scroll-hint">↔ 表格可左右滑動查看完整欄位</div>
  <div class="tablebox">
    <table id="tbl">
      <thead>
        <tr>
          <th data-k="sport">運動種類</th>
          <th data-k="tournament_name">賽事名稱</th>
          <th data-k="division">大直出賽組別</th>
          <th data-k="match_date">比賽日期 ▲</th>
          <th data-k="venue">比賽場館 / 地點</th>
          <th data-k="opponents_draw">對戰隊伍 / 分組籤位</th>
          <th data-k="advancement_rule">晉級賽制</th>
          <th data-k="status">籤表狀態</th>
          <th data-k="athletes">出賽選手</th>
        </tr>
        <tr class="filterrow">
          <th><input placeholder="篩選"></th>
          <th><input placeholder="篩選"></th>
          <th><input placeholder="篩選"></th>
          <th><input placeholder="篩選"></th>
          <th><input placeholder="篩選"></th>
          <th><input placeholder="篩選"></th>
          <th><input placeholder="篩選"></th>
          <th><input placeholder="篩選"></th>
          <th><input placeholder="篩選"></th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
  <div class="foot">資料來源：大直高中運動賽事管理系統</div>
</div>
<script>
const SUPABASE_URL='https://hdxrublbpaptthmflnrn.supabase.co';
const SUPABASE_KEY='sb_publishable_n3ONLlgwYQ0TAOcxkKoNhg_ZwL6M9wP';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let rows=[], sortKey='match_date', sortDir=1;
const keys=['sport','tournament_name','division','match_date','venue','opponents_draw','advancement_rule','status','athletes'];
const tbody=document.querySelector('tbody');
const filters=[...document.querySelectorAll('.filterrow input')];
function norm(v){return String(v??'').trim()}
function dateKey(v){const s=norm(v).split(' ')[0];const m=s.match(/^(\d{2,4})\/(\d{1,2})\/(\d{1,2})$/);if(m){let y=+m[1];if(y<1911)y+=1911;return y*10000+(+m[2])*100+(+m[3]);}return 99999999}
function formatMatchDate(v){
  const raw=norm(v);
  const m=raw.match(/^(\d{2,4})\/(\d{1,2})\/(\d{1,2})(.*)$/);
  if(!m)return raw;
  let y=+m[1];
  const month=+m[2],day=+m[3];
  const displayYear=y;
  if(y<1911)y+=1911;
  const d=new Date(y,month-1,day);
  if(d.getFullYear()!==y||d.getMonth()!==month-1||d.getDate()!==day)return raw;
  const weekday=['日','一','二','三','四','五','六'][d.getDay()];
  return `${displayYear}/${m[2]}/${m[3]}（${weekday}）${m[4]||''}`;
}
function esc(s){return norm(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}
function sportLabel(s){const x=norm(s).replace(/^[^\w\u4e00-\u9fff]+/,'').trim();const emo=x.includes('籃球')?'🏀':x.includes('排球')?'🏐':x.includes('擊劍')?'🤺':x.includes('空手道')?'🥋':x.includes('網球')?'🎾':x.includes('棒球')?'⚾':x.includes('足球')?'⚽':'🏅';return `${emo} ${x||'其他'}`}

const publicRoster={
 hard:{
  jBTeam:'張○荃、倪○岳、張○瑞、陳○哲、陳○宇、嚴○軒、邱○森',
  jGTeam:'李○瑾、魏○芯、簡○函、吳○晏、劉○青、陳○蕎',
  hBTeam:'藍○翔、陳○宇、林○希、曾○謙、呂○霆、謝○軒、徐○原',
  hGTeam:'徐○詠、黃○嘉、簡○嫻、張○',
  jBSingle:'嚴○軒、吳○辰、陳○閎',jGSingle:'李○瑾、吳○晏',
  hBSingle:'曾○謙、謝○軒、王○元',hGSingle:'張○',
  jBDouble:'張○荃／倪○岳、張○瑞／陳○哲、陳○宇／陳○璟',
  jGDouble:'劉○青／陳○蕎、簡○函／魏○芯',
  hBDouble:'藍○翔／陳○宇、呂○霆／徐○原、林○慶／魏○澤',
  hMixed:'林○希／徐○詠、吳○維／黃○嘉、陳○均／簡○嫻'
 },
 soft:{
  jBTeam:'張○荃、倪○岳、張○瑞、陳○哲、陳○宇、嚴○軒、邱○森、陳○璟',
  jGTeam:'李○瑾、魏○芯、簡○函、吳○晏、劉○青、陳○蕎',
  hBTeam:'藍○翔、陳○宇、林○希、曾○謙、吳○維、陳○均、林○慶、徐○原',
  hGTeam:'徐○詠、黃○嘉、簡○嫻、張○',
  jBSingle:'嚴○軒、陳○閎、吳○辰',hBSingle:'曾○謙、楊○翔、林○希',hGSingle:'張○',
  jBDouble:'張○瑞／陳○哲、陳○宇／陳○璟、張○荃／倪○岳',
  jGDouble:'李○瑾／吳○晏、魏○芯／簡○函、劉○青／陳○蕎',
  hBDouble:'陳○均／吳○維、王○元／徐○原、呂○霆／謝○軒',
  hMixed:'徐○詠／藍○翔、黃○嘉／陳○宇、簡○嫻／魏○澤'
 },
 ping:{
  jB:'陳○霖、王○辰、林○宇、林○樂、梁○新、許○盛、劉○昇、杜○勳、陳○璟、黃○洋',
  jG:'錢○言、顏○希、張○綺、陳○霖',
  hB:'楊○程、張○閑、洪○茂',
  hG:'鍾○穎、吳○融'
 }
};
const tennisDayGroups={
 '115/11/09':[['國男甲團體','hard','jBTeam'],['國女甲團體','hard','jGTeam'],['高男甲團體','hard','hBTeam'],['高女甲團體','hard','hGTeam']],
 '115/11/10':[['國男甲團體','hard','jBTeam'],['國女甲團體','hard','jGTeam'],['國男甲單打','hard','jBSingle'],['高男甲單打','hard','hBSingle'],['高女甲單打','hard','hGSingle']],
 '115/11/11':[['國男甲單打','hard','jBSingle'],['國女甲單打','hard','jGSingle'],['高男甲單打','hard','hBSingle'],['國男甲雙打','hard','jBDouble'],['國女甲雙打','hard','jGDouble'],['高男甲雙打','hard','hBDouble']],
 '115/11/12':[['國男甲雙打','hard','jBDouble'],['國女甲雙打','hard','jGDouble'],['高男甲雙打','hard','hBDouble']],
 '115/11/13':[['高中甲混雙','hard','hMixed']],
 '115/11/16':[['國男團體','soft','jBTeam'],['國女團體','soft','jGTeam'],['高男團體','soft','hBTeam'],['高女團體','soft','hGTeam'],['國男單打','soft','jBSingle'],['高男單打','soft','hBSingle'],['高女單打','soft','hGSingle']],
 '115/11/17':[['國男雙打','soft','jBDouble'],['國女雙打','soft','jGDouble'],['高男雙打','soft','hBDouble'],['高中混雙','soft','hMixed']]
};
function rosterGroups(r){
 const name=norm(r.tournament_name),date=norm(r.match_date).split(' ')[0];
 if(name.includes('教育盃')&&name.includes('網球')&&tennisDayGroups[date]){
   return tennisDayGroups[date].map(([label,kind,key])=>({label,text:publicRoster[kind][key]}));
 }
 if(name.includes('教育盃')&&name.includes('桌球')){
   return [['國男乙組',publicRoster.ping.jB],['國女乙組',publicRoster.ping.jG],['高男乙組',publicRoster.ping.hB],['高女乙組',publicRoster.ping.hG]].map(([label,text])=>({label,text}));
 }
 if(name.includes('教育盃')&&name.includes('擊劍')){
   const match=norm(r.opponents_draw).match(/[\u4e00-\u9fff]○[\u4e00-\u9fff]/);
   if(match)return [{label:'參賽選手',text:match[0]}];
 }
 return [];
}
function rosterText(r){return rosterGroups(r).map(x=>x.label+' '+x.text).join(' ')}
function rosterCell(r){
 const groups=rosterGroups(r);
 if(!groups.length)return '<span class="muted">名單待確認</span>';
 const units=groups.map(x=>'<div class="roster-group"><strong>'+esc(x.label)+'</strong><div>'+esc(x.text)+'</div></div>').join('');
 return '<details class="roster-details"><summary>檢視報名選手（'+groups.length+'組）</summary><div class="roster-scroll">'+units+'<div class="roster-note">依報名表彙整，非當日確定上場名單。</div></div></details>';
}

function isCompleted(r){return /已完賽|已結束|比賽結束/.test(norm(r.status))}
function rowPriority(r){
  if(isCompleted(r))return 3;
  const date=dateKey(r.match_date);
  if(date===99999999)return 2;
  const now=new Date();
  const today=now.getFullYear()*10000+(now.getMonth()+1)*100+now.getDate();
  return date>=today?0:1;
}
function sortDateTime(r){const d=norm(r.match_date);const t=norm(r.match_time);return d.includes(':')?d.slice(d.search(/\d\d:\d\d/)):t}
function filtered(){
  const q=norm(document.getElementById('q').value).toLowerCase(),sp=document.getElementById('sport').value;
  return rows.filter(r=>{
    if(sp&&norm(r.sport)!==sp)return false;
    if(q&&!keys.some(k=>norm(k==='athletes'?rosterText(r):r[k]).toLowerCase().includes(q)))return false;
    return filters.every((f,i)=>!norm(f.value)||norm(keys[i]==='athletes'?rosterText(r):r[keys[i]]).toLowerCase().includes(norm(f.value).toLowerCase()))
  }).sort((a,b)=>{
    const groupA=rowPriority(a),groupB=rowPriority(b);
    if(groupA!==groupB)return groupA-groupB;
    let av=sortKey==='athletes'?rosterText(a):a[sortKey],bv=sortKey==='athletes'?rosterText(b):b[sortKey];
    if(sortKey==='match_date'){
      const da=dateKey(av),db=dateKey(bv);
      // 未來比賽依日期近到遠；歷史未標記場次依最近到最遠；已完賽永遠放最後。
      const dir=groupA===0?1:groupA===1?-1:sortDir;
      if(da!==db)return (da-db)*dir;
      return sortDateTime(a).localeCompare(sortDateTime(b),'zh-Hant',{numeric:true})*dir;
    }
    return norm(av).localeCompare(norm(bv),'zh-Hant',{numeric:true})*sortDir
  })
}
function render(){
  const data=filtered();
  tbody.innerHTML=data.length?data.map(r=>`<tr class="${isCompleted(r)?'completed':''}"><td><span class="sport">${esc(sportLabel(r.sport))}</span></td><td><strong>${esc(r.tournament_name)}</strong></td><td>${esc(r.division)}</td><td><strong>${esc(formatMatchDate(r.match_date))}</strong></td><td>${esc(r.venue)}</td><td class="match">${esc(r.opponents_draw)}</td><td>${esc(r.advancement_rule||'-')}</td><td><span class="status">${esc(r.status||'-')}</span></td><td class="roster-cell">${rosterCell(r)}</td></tr>`).join(''):`<tr><td colspan="9" class="empty">目前沒有符合條件的資料</td></tr>`
}
async function load(){
  const {data,error}=await sb.from('schedules').select('*');
  if(error){tbody.innerHTML=`<tr><td colspan="9" class="empty">資料載入失敗：${esc(error.message)}</td></tr>`;return}
  rows=data||[];
  const sports=[...new Set(rows.map(r=>norm(r.sport)).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'zh-Hant'));
  document.getElementById('sport').innerHTML='<option value="">全部運動種類</option>'+sports.map(s=>`<option>${esc(s)}</option>`).join('');
  render()
}
document.getElementById('q').addEventListener('input',render);
document.getElementById('sport').addEventListener('change',render);
filters.forEach(f=>f.addEventListener('input',render));
document.querySelectorAll('th[data-k]').forEach(th=>th.addEventListener('click',()=>{
  const k=th.dataset.k;
  if(sortKey===k)sortDir*=-1;else{sortKey=k;sortDir=1}
  document.querySelectorAll('th[data-k]').forEach(x=>x.textContent=x.textContent.replace(/\s[▲▼]$/,''));
  th.textContent+=sortDir===1?' ▲':' ▼';
  render()
}));
load();
</script>
</body>
</html>
