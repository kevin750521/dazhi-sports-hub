      padding-bottom: 60px;

    .header {

      box-shadow: 0 4px 12px rgba(30, 58, 138, 0.15);
      position: sticky;
      top: 0;
      z-index: 100;

    .header-content {
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }
    .brand h1 {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand p {
      font-size: 0.875rem;
      opacity: 0.9;
      margin-top: 4px;
    }
    .header-actions {

      align-items: center;
      gap: 12px;
    }
    .sync-status {

      align-items: center;

      background: rgba(255, 255, 255, 0.15);

      border: 1px solid var(--border);

      flex-wrap: wrap;
      gap: 14px;
      align-items: center;

    function initSupabaseConnection() {
      const url = localStorage.getItem('dazhi_supabase_url') || DEFAULT_SUPABASE_URL;

      txt.textContent = '🟡 內建離線資料模式 (點擊設定)';

        async function fetchDataFromSupabase() {
      const url = localStorage.getItem('dazhi_supabase_url') || DEFAULT_SUPABASE_URL;
      const key = localStorage.getItem('dazhi_supabase_key') || DEFAULT_SUPABASE_KEY;
      const dot = document.getElementById('statusDot');
      const txt = document.getElementById('statusText');

      // 優先使用 Supabase SDK
      if (supabaseClient) {
        try {
          const { data: tData, error: tErr } = await supabaseClient.from('tournaments').select('*').order('id', { ascending: true });
          if (!tErr && tData && tData.length > 0) {
            currentTournaments = tData;
            document.getElementById('tournamentsCount').textContent = tData.length;
          }

          const { data: sData, error: sErr } = await supabaseClient.from('schedules').select('*').order('id', { ascending: true });
          if (!sErr && sData && sData.length > 0) {
            currentSchedules = sData;
            document.getElementById('schedulesCount').textContent = sData.length;
          }

          dot.className = 'status-dot';
          txt.textContent = '🟢 Supabase 即時同步中 (' + currentTournaments.length + ' 賽事 / ' + currentSchedules.length + ' 賽程)';
          renderStats();
          populateFilters();
          renderActiveView();
          return;
        } catch (e) {
          console.warn('Supabase SDK 讀取異常，切換至 REST API 直接連線:', e);
        }
      }

      // REST API 直接連線備援
      try {
        const headers = { 'apikey': key, 'Authorization': 'Bearer ' + key };
        const [resT, resS] = await Promise.all([
          fetch(url + '/rest/v1/tournaments?select=*&order=id.asc', { headers }),
          fetch(url + '/rest/v1/schedules?select=*&order=id.asc', { headers })
        ]);
        if (resT.ok && resS.ok) {
          const tData = await resT.json();
          const sData = await resS.json();
          if (tData && tData.length > 0) {
            currentTournaments = tData;
            document.getElementById('tournamentsCount').textContent = tData.length;
          }
          if (sData && sData.length > 0) {
            currentSchedules = sData;
            document.getElementById('schedulesCount').textContent = sData.length;
          }
          dot.className = 'status-dot';
          txt.textContent = '🟢 Supabase 即時同步中 (' + currentTournaments.length + ' 賽事 / ' + currentSchedules.length + ' 賽程)';
          renderStats();
          populateFilters();
          renderActiveView();
          return;
        }
      } catch (err) {
        console.warn('REST API 讀取異常，保留內建完整預載資料:', err);
      }

      // 若尚未建表或離線，使用內建資料並提示
      dot.className = 'status-dot offline';
      txt.textContent = '🟡 內建完整資料庫模式 (已連線準備)';
      renderStats();
      populateFilters();
      renderActiveView();
    }
